<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Defensive Security Autonomous Mitigation Harness — Console</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 4.5 7v8.2c0 7.1 4.9 12.6 11.5 14.3 6.6-1.7 11.5-7.2 11.5-14.3V7L16 2.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M10.5 16.2 14.4 20l7.1-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Defensive Security Harness</span>
          <span class="brand-sub">Operator Console</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/fleet" data-view="fleet"><span class="nav-ico" data-icon="fleet"></span><span>Fleet &amp; Posture</span></a>
        <a href="#/investigations" data-view="investigations"><span class="nav-ico" data-icon="incident"></span><span>Investigations</span><span class="nav-count" id="nav-incidents"></span></a>
        <a href="#/baselines" data-view="baselines"><span class="nav-ico" data-icon="baseline"></span><span>Baselines &amp; Telemetry</span></a>
        <a href="#/audit" data-view="audit"><span class="nav-ico" data-icon="audit"></span><span>Policy &amp; Audit</span></a>
      </nav>
      <div class="rail-foot" id="rail-status" aria-live="polite"></div>
    </aside>

    <div class="stage">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Fleet &amp; Posture</h1>
          <p id="view-sub" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <div id="chain-pill"></div>
          <button type="button" class="btn btn-ghost" id="refresh-btn" title="Refresh (r)">
            <span data-icon="refresh"></span><span>Refresh</span>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
