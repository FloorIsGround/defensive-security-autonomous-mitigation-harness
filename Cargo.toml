[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/policy",
    "crates/agent-d",
    "crates/control-d",
    "crates/admin-cli",
    "crates/mcp-adapter",
    "crates/action-exec-d",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["fs", "socket", "user"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
zbus = { version = "5.3", default-features = false, features = ["tokio"] }

defsec-protocol = { path = "crates/protocol" }
defsec-policy = { path = "crates/policy" }
